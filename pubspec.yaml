name: qalachronos
description: Educational architecture guide prototype.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  latlong2: ^0.10.1
  model_viewer_plus: ^1.10.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/avatar/
    - assets/3D_models/
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
